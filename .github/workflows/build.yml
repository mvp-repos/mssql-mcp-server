name: Build

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 SDK required for Microsoft.Testing.Platform (global.json); app targets net9.0
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore McpServer.sln

      - name: Build
        run: dotnet build McpServer.sln --configuration Release --no-restore

      # Integration tests need a live SQL Server; skip them in CI.
      - name: Test (exclude integration)
        run: >
          dotnet test --solution McpServer.sln
          --configuration Release
          --no-build
          --verbosity normal
          --filter "TestCategory!=Integration"
