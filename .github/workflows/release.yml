name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 10 SDK required for Microsoft.Testing.Platform (global.json); app still targets net8.0
          dotnet-version: "10.0.x"

      # Integration tests need a live SQL Server; skip them in CI.
      - name: Run tests (exclude integration)
        run: >
          dotnet test --solution SqlMcpServer.sln
          -c Release
          --filter "TestCategory!=Integration"

      - name: Publish (self-contained single-file)
        run: >
          dotnet publish SqlMcpServer.Server/SqlMcpServer.Server.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/win-x64

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/win-x64/* -DestinationPath ./SqlMcpServer-win-x64.zip -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./SqlMcpServer-win-x64.zip
          generate_release_notes: true
